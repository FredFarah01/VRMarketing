services:
  - type: web
    name: veridyn-sales-staging
    runtime: python
    branch: feature/cqc-sales-platform
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CQC_API_KEY
        sync: false
      - key: CQC_API_BASE_URL
        value: https://api.service.cqc.org.uk/public/v1
      - key: CQC_API_KEY_HEADER
        value: Ocp-Apim-Subscription-Key
